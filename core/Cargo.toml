[package]
name = "timer-core"
version = "0.2.0"
authors = ["Tyler Colby"]
edition = "2021"
description = "Pure logic for Timers: suspend-safe clock, stopwatch, countdowns, Pomodoro, saved settings and the screen state machine. No Xous dependencies."
license = "Apache-2.0"

# Keep this crate free of xous/gam/pddb so `cargo test` runs on any machine.
[dependencies]
# Pure appkit parts (keys). Git so `cargo test` works in this repo;
# bin/integrate patches it to the in-tree copy.
precursor-appkit-core = { git = "https://github.com/tbcolby/xous-dev-toolkit" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
